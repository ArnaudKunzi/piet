# Pushing a version tag builds every download from that one commit and publishes
# them together, so no platform's release lags another's.
name: Release
on:
  push:
    tags: ['A.*']
permissions:
  contents: read
jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test
        env:
          BUILD_JOBS: 3
        run: sh scripts/build-macos.sh
      - name: Package the disk image
        run: sh scripts/package-macos-dmg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piet-macos-arm64
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.sha256
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Check the binaries carry this tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for file in "PIET-$TAG-setup.exe" "PIET-$TAG-windows-x64-portable.zip" "PIET-$TAG-macos-arm64.dmg"; do
            test -s "assets/$file" || { echo "Missing assets/$file: the tag and the compiled version disagree"; ls assets; exit 1; }
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # This release's notes are the first section of RELEASE_NOTES.md.
          awk 'NR > 1 && /^# /{exit} {print}' RELEASE_NOTES.md > notes.md
          title=$(sed -n '1s/^# //p' notes.md)
          gh release create "$TAG" assets/* --verify-tag --title "$title" --notes-file notes.md
